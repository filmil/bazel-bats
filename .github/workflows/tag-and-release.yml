# When run:
# * tags a new release based on main top of tree, when a commit asks for one.
# * runs the tests, builds a source bundle, attests its provenance, and
#   publishes all of it as a GitHub release.
#
# The workflow can be run manually, otherwise it runs once a week.
#
# The release itself is built by the reusable workflow from
# bazel-contrib/.github. That workflow is not interchangeable with a local
# equivalent: the Bazel Central Registry verifies the source archive
# attestation with slsa-verifier against a hard-coded builder id, set in
# tools/slsa.py of bazelbuild/bazel-central-registry, and that id names
# release_ruleset.yaml. An attestation produced by any other workflow is
# rejected by BCR presubmit.
name: Tag and Release

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only on repositories whose default
    # workflow permission is read-only, and the tag push then fails with
    # "Resource not accessible by integration" after the action has already
    # printed the version it computed.
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag action analyses the commits since the previous tag. With
          # the default shallow checkout it finds none, reports "Analysis of 0
          # commits complete: no release", and emits an empty new_tag.
          fetch-depth: 0
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          # Without this the action bumps the patch version on every run, even
          # when no commit landed since the last tag. The cron then released the
          # same tree again and again. `false` makes the action emit an empty
          # `new_tag` when no commit asks for a release, and the guard below
          # then skips the release.
          default_bump: false

  # Runs the tests, builds bazel-bats-<tag>.zip through
  # .github/workflows/release_prep.sh, attests the archive with
  # actions/attest-build-provenance, and creates the GitHub release with the
  # archive and its bazel-bats-<tag>.zip.intoto.jsonl attestation attached.
  release:
    needs: tag
    if: ${{ needs.tag.outputs.new_tag != '' }}
    permissions:
      contents: write      # upload release files
      id-token: write      # attest provenance
      attestations: write  # attest provenance
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      tag_name: ${{ needs.tag.outputs.new_tag }}
      release_files: bazel-bats-${{ needs.tag.outputs.new_tag }}.zip
      prerelease: false

  # BCR is the only publish that attests, see the note in publish.yml. This
  # job still runs after that one rather than beside it, so that the order in
  # which the two registries see the release stays fixed, and so that turning
  # `attest` back on in publish.yml cannot silently produce two attesting
  # publishes racing to overwrite the same two release assets.
  publish-bcr:
    needs: [tag, release]
    if: ${{ needs.tag.outputs.new_tag != '' }}
    uses: ./.github/workflows/publish-bcr.yml
    with:
      tag_name: ${{ needs.tag.outputs.new_tag }}
    secrets: inherit
