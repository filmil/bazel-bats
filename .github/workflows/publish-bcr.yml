# Based on the instructions at https://github.com/bazel-contrib/publish-to-bcr
name: "Publish on Bazel Central Registry"

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string
      check_token_only:
        description: "Check BCR_PUBLISH_TOKEN and sync the fork, publish nothing"
        required: false
        default: false
        type: boolean

jobs:
  # Sync the BCR fork's main with upstream before anything is pushed to it.
  #
  # The publish flow cuts its entry branch from upstream BCR and pushes it to
  # the fork. When upstream has touched any `.github/workflows/*` file since
  # the fork last synced, that push carries workflow-file commits the fork has
  # never seen, and a PAT without the `workflow` scope is rejected:
  #
  #     ! [remote rejected] (refusing to allow a Personal Access Token to
  #       create or update workflow `.github/workflows/dismiss_approvals.yml`
  #       without `workflow` scope)
  #
  # (run 33282606259, publishing v0.38.41). Syncing first makes those commits
  # already-known, so the entry push is clean.
  #
  # An earlier version of this comment claimed the merge-upstream API was not
  # subject to that check. That is wrong. Run 34162805144, publishing
  # v0.38.42, failed here with the same message and HTTP 422: merge-upstream
  # writes the upstream workflow files into the fork and is refused for the
  # same reason a push is. Syncing only ever worked because the fork happened
  # to be current on the workflow files.
  #
  # The fix is the token, not the step. BCR_PUBLISH_TOKEN needs the `workflow`
  # scope alongside `repo`. Until it has it, this job fails whenever upstream
  # BCR has touched a workflow file since the last successful sync, and the
  # fork has to be synced by hand over SSH, which is not subject to PAT scope
  # checks:
  #
  #     git push ssh://git@github.com/filmil/bazel-central-registry.git \
  #       FETCH_HEAD:refs/heads/main
  sync-fork:
    runs-on: ubuntu-latest
    steps:
      # Read the token's own scopes before using it. A missing `workflow`
      # scope only shows up later, as an HTTP 422 on whichever step first
      # carries an upstream workflow file, and it shows up on some runs and
      # not others depending on what upstream touched. Checking here fails
      # the same way every time, before a publish is attempted.
      #
      # This prints scope names, never the token. An empty scope list means a
      # fine-grained PAT, which publish-to-bcr does not support: it cannot
      # open a pull request against a public repository.
      - name: Check the token scopes
        env:
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          scopes="$(gh api -i user 2>/dev/null \
            | tr -d '\r' \
            | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: *//p')"
          echo "BCR_PUBLISH_TOKEN scopes: ${scopes:-<none>}"
          if [[ -z "${scopes}" ]]; then
            echo "::error::BCR_PUBLISH_TOKEN reports no OAuth scopes."
            echo "::error::That means a fine-grained PAT, which cannot open a"
            echo "::error::pull request against a public repository. Use a"
            echo "::error::classic PAT with 'repo' and 'workflow'."
            exit 1
          fi
          for want in repo workflow; do
            if ! grep -qw "${want}" <<<"${scopes}"; then
              echo "::error::BCR_PUBLISH_TOKEN is missing the '${want}' scope."
              echo "::error::It has: ${scopes}"
              echo "::error::Re-mint a classic PAT with 'repo' and 'workflow',"
              echo "::error::then: gh secret set BCR_PUBLISH_TOKEN -R filmil/bazel-bats"
              exit 1
            fi
          done
          echo "Both 'repo' and 'workflow' are present."

      - name: Sync filmil/bazel-central-registry with upstream
        env:
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          if ! out="$(gh api -X POST \
              repos/filmil/bazel-central-registry/merge-upstream \
              -f branch=main 2>&1)"; then
            echo "${out}"
            if grep -q 'without .workflow. scope' <<<"${out}"; then
              echo "::error::BCR_PUBLISH_TOKEN is missing the 'workflow' scope."
              echo "::error::Upstream BCR changed a file under .github/workflows/,"
              echo "::error::so syncing the fork now needs that scope. Re-mint the"
              echo "::error::PAT with 'repo' and 'workflow', then:"
              echo "::error::  gh secret set BCR_PUBLISH_TOKEN -R filmil/bazel-bats"
            fi
            exit 1
          fi
          echo "${out}"

  publish:
    needs: sync-fork
    if: ${{ inputs.check_token_only != true }}
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v0.2.2"
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: filmil/bazel-central-registry
      attest: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}

